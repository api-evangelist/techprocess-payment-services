name: TechProcess Payment Services
description: >-
  TechProcess Payment Services is an Indian digital-payments pioneer that has
  been building and operating cloud-based electronic-payment platforms since
  2000, when it launched BillJunction.com, India's first electronic bill
  presentment and payment service. Its payment gateway supports card payments,
  Net-banking, NACH, NEFT/RTGS, IMPS, UPI and e-wallets for merchants across
  India. The business is now part of Worldline India (ePayments India), whose
  merchant checkout product is Paynimo, offering hosted and embeddable checkout,
  native mobile SDKs, and 20+ e-commerce platform plugins so developers can
  accept digital payments with a few lines of code. Originally a Battery
  Ventures portfolio company, it was acquired by Ingenico Group and folded into
  Worldline.
